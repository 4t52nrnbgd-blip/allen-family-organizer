<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fa98f">
<title>The Allen's — Family Organizer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>The Allen's</h1>
    <p id="topbar-sub">Family organizer</p>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav id="bottomnav" aria-label="Main navigation" hidden>
    <button type="button" data-tab="home" class="nav-btn active" aria-label="Home">🏠<span>Home</span></button>
    <button type="button" data-tab="calendar" class="nav-btn" aria-label="Calendar">📅<span>Calendar</span></button>
    <button type="button" data-tab="tasks" class="nav-btn" aria-label="Tasks">✅<span>Tasks</span></button>
    <button type="button" data-tab="refills" class="nav-btn" aria-label="Refills">💊<span>Refills</span></button>
    <button type="button" data-tab="meals" class="nav-btn" aria-label="Meals">🍽️<span>Meals</span></button>
    <button type="button" data-tab="bear" class="nav-btn" aria-label="Bear">🐾<span>Bear</span></button>
    <button type="button" data-tab="account" class="nav-btn" aria-label="Account">👤<span>Account</span></button>
  </nav>

  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
